<main id="history-view" class="content page-view" hidden><div class="page-heading"><div><p>Attendance management</p><h1>Attendance History</h1><p>Review active and archived attendance sessions.</p></div><button class="primary-action" data-page-link="attendance"><i data-lucide="clipboard-check"></i> Take Attendance</button></div><section class="toolbar card history-filters"><label class="filter-control"><span>Course</span><select id="history-course"><option value="">All courses</option></select></label><label class="filter-control"><span>Semester</span><select id="history-semester"><option value="">All semesters</option></select></label><label class="filter-control"><span>From</span><input id="history-from" type="date"></label><label class="filter-control"><span>To</span><input id="history-to" type="date"></label><label class="filter-control"><span>Status</span><select id="history-status"><option value="">All</option><option value="ACTIVE">Active</option><option value="ARCHIVED">Archived</option></select></label><button class="text-button" id="clear-history-filters">Clear</button></section><div id="history-message" class="inline-message error" hidden></div><section class="card data-card"><div class="table-wrap"><table class="history-table"><thead><tr><th>Date</th><th>Course</th><th>Total</th><th>Present</th><th>Absent</th><th>Rate</th><th>Status</th><th></th></tr></thead><tbody id="history-table"></tbody></table></div></section></main>
<div class="modal-backdrop" id="history-modal" hidden><section class="modal history-modal" role="dialog" aria-modal="true" aria-labelledby="history-modal-title"><button class="icon-button modal-close" aria-label="Close session details"><i data-lucide="x"></i></button><div id="history-modal-content"></div></section></div>
