<main id="attendance-view" class="content page-view" hidden><div class="page-heading"><div><p>Attendance management</p><h1>Take Attendance</h1><p>Select a course and date, then mark every enrolled student.</p></div></div><section class="card attendance-controls"><label><span>Course</span><select id="attendance-course" aria-label="Select course"></select></label><label><span>Attendance date</span><input id="attendance-date" type="date" aria-label="Attendance date"></label><div id="attendance-session-state" class="session-state"></div></section><div id="attendance-message" class="inline-message" role="status" hidden></div><section id="attendance-workspace" class="card data-card"><div class="card-heading attendance-heading"><div><h2 id="attendance-roster-title">Student roster</h2><p id="attendance-roster-caption">Choose a course to begin</p></div><div class="bulk-actions"><button class="outline-button" id="mark-all-present">Mark All Present</button><button class="outline-button" id="mark-all-absent">Mark All Absent</button></div></div><div class="attendance-summary"><span><small>Total</small><strong id="attendance-total">0</strong></span><span class="summary-present"><small>Present</small><strong id="attendance-present">0</strong></span><span class="summary-absent"><small>Absent</small><strong id="attendance-absent">0</strong></span><span><small>Unmarked</small><strong id="attendance-unmarked">0</strong></span></div><div class="table-wrap"><table class="attendance-table"><thead><tr><th>Student</th><th>Roll / ID</th><th>Status</th></tr></thead><tbody id="attendance-students-table"></tbody></table></div><footer class="form-footer"><button class="primary-action" id="save-attendance"><i data-lucide="save"></i> Save Attendance</button></footer></section></main>
