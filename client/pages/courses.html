<main id="courses-view" class="content page-view" hidden><div class="page-heading"><div><p>Course management</p><h1>My Courses</h1><p>View assigned courses and enrolled students.</p></div><button class="primary-action admin-only" id="add-course"><i data-lucide="plus"></i> Add Course</button></div><div id="course-message" class="inline-message" hidden></div><section class="toolbar card"><label class="search-control"><i data-lucide="search"></i><input id="course-search" type="search" placeholder="Search by course name or code" aria-label="Search courses"></label><label class="filter-control"><span>Semester</span><select id="course-semester-filter"><option value="">All semesters</option></select></label><span id="course-result-count"></span></section><section id="course-list" class="course-card-grid"></section><section class="card semester-panel admin-only"><div class="card-heading"><div><h2>Semesters</h2><p>Manage academic periods</p></div><button class="outline-button" id="add-semester">Add semester</button></div><div class="table-wrap"><table><thead><tr><th>Semester</th><th>Academic year</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody id="semester-table"></tbody></table></div></section></main>
<div class="modal-backdrop" id="semester-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="semester-form-title"><button class="icon-button modal-close" type="button" aria-label="Close"><i data-lucide="x"></i></button><h2 id="semester-form-title">Add semester</h2><form id="semester-form" class="management-form"><input type="hidden" name="id"><label>Name<input name="name" required></label><label>Academic year<input name="academicYear" required placeholder="2026–2027"></label><label>Start date<input name="startDate" type="date" required></label><label>End date<input name="endDate" type="date" required></label><label class="check-field"><input type="checkbox" name="isActive" checked> Active semester</label><p class="form-error" hidden></p><div class="form-actions"><button type="button" class="outline-button cancel-form">Cancel</button><button type="submit" class="primary-action">Save semester</button></div></form></section></div>
<div class="modal-backdrop" id="course-modal" hidden><section class="modal wide-modal" role="dialog" aria-modal="true" aria-labelledby="course-form-title"><button class="icon-button modal-close" type="button" aria-label="Close"><i data-lucide="x"></i></button><h2 id="course-form-title">Add course</h2><form id="course-form" class="management-form form-grid"><input type="hidden" name="id"><label>Course code<input name="code" required></label><label>Course name<input name="name" required></label><label>Department<input name="department" required></label><label>Semester<select name="semesterId" required></select></label><label>Teacher<select name="teacherId" required></select></label><label>Day<select name="day"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label><label>Start time<input name="startTime" type="time" required></label><label>Duration (minutes)<input name="durationMinutes" type="number" min="1" value="60" required></label><label>Room<input name="room"></label><label class="full-field">Enrolled students<select name="enrolledStudentIds" multiple size="7"></select></label><label class="check-field full-field"><input type="checkbox" name="isActive" checked> Active course</label><p class="form-error full-field" hidden></p><div class="form-actions full-field"><button type="button" class="outline-button cancel-form">Cancel</button><button type="submit" class="primary-action">Save course</button></div></form></section></div>
