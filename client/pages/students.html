<main id="students-view" class="content page-view" hidden><div class="page-heading"><div><p>Student management</p><h1>Students</h1><p>Students available across your courses.</p></div><div class="heading-actions"><button class="primary-action admin-only" id="add-student"><i data-lucide="user-plus"></i> Add Student</button><div class="count-chip"><strong id="student-total">0</strong><span>Total students</span></div></div></div><div id="student-message" class="inline-message" hidden></div><section class="toolbar card"><label class="search-control"><i data-lucide="search"></i><input id="student-search" type="search" placeholder="Search by name or student ID" aria-label="Search students"></label><label class="filter-control"><span>Course</span><select id="course-filter" aria-label="Filter students by course"><option value="">All courses</option></select></label><label class="filter-control"><span>Status</span><select id="student-status"><option value="active">Active</option><option value="all">All</option><option value="inactive">Inactive</option></select></label></section><section class="card data-card"><div class="table-wrap"><table><thead><tr><th>Student</th><th>ID / Roll</th><th>Department</th><th>Semester</th><th>Enrolled courses</th><th></th></tr></thead><tbody id="students-table"></tbody></table></div></section></main>
<div class="modal-backdrop" id="student-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="student-modal-title"><button class="icon-button modal-close" aria-label="Close student details"><i data-lucide="x"></i></button><div id="student-modal-content"></div></section></div>
<div class="modal-backdrop" id="student-form-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="student-form-title"><button class="icon-button modal-close" type="button" aria-label="Close"><i data-lucide="x"></i></button><h2 id="student-form-title">Add student</h2><form id="student-form" class="management-form"><input type="hidden" name="id"><label>Name<input name="name" required maxlength="150"></label><label>Student ID / Roll<input name="roll" required maxlength="150"></label><label>Department<input name="department" required maxlength="150"></label><label>Semester<select name="semester" required></select></label><label class="check-field"><input type="checkbox" name="isActive" checked> Active student</label><p class="form-error" hidden></p><div class="form-actions"><button type="button" class="outline-button cancel-form">Cancel</button><button type="submit" class="primary-action">Save student</button></div></form></section></div>
